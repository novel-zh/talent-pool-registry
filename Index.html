<script>
(() => {
const root=document.getElementById('personnel-drawers');
let people=[];
let loading=false,saving=false,canCreate=false,editor=null;
const q=s=>root.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>v?esc(v):'<span class="pd-missing">Не заполнено</span>';
const pageSize=10;
const backToTop=q('#pd-to-top');
function updateBackToTop(){backToTop.hidden=window.scrollY<300;}
window.addEventListener('scroll',updateBackToTop,{passive:true});
backToTop.addEventListener('click',()=>{
 q('#pd-search').focus({preventScroll:true});
 window.scrollTo({top:0,left:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});
updateBackToTop();
let currentPage=1,openId=null;
const cityOf=p=>(p.region||p.analysisRegion||'').trim();
const trackOf=p=>(p.track||p.trackDE||'').trim();
const levelOf=p=>String(p.level||'').trim();
let appliedFilters={},draftFilters={};
const filterGroups=[
 ['Основные сведения',[
  ['region','Город / регион','category'],['level','Уровень в основном списке','category'],['track','Направление / трек','category'],['name','ФИО','text'],['activity','Специальность и деятельность','text'],['trackDE','Entwicklungstrack','category'],['number','№ в основном списке','number']]],
 ['Контакты',[
  ['phone','Телефон','phone'],['email','Email','text'],['birth','Дата рождения','date']]],
 ['Оценки и уровни',[
  ['dec2025','Уровень на 30.12.2025','category'],['jun2026','Уровень на 30.06.2026','category'],['dec2026','Уровень на 30.12.2026','category']]],
 ['Анализ БКР',[
  ['analysisNumber','№ в анализе БКР','number'],['analysisRegion','Город / регион в анализе БКР','category'],['goal','Цель участника через 5 лет','text'],['recommendation','Рекомендация РО / РП / ИБ','text'],['training','Обучения и проекты за 2026 год','text'],['plan2027','План на 2027 год','text']]],
 ['Рекомендации из основного списка',[
  ['mainNote','Рекомендации и комментарии','text'],['future','Дальнейшее развитие','text']]]
];
const allFilterFields=filterGroups.flatMap(g=>g[1]);
const filterDialog=q('#pd-filter-dialog');
function fieldValue(p,key){return String(p[key]??'').trim();}
function normalized(s){return String(s??'').trim().toLocaleLowerCase().replace(/\s+/g,' ');}
function dateValue(s){const m=String(s).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:'';}
function ruleActive(r){return !!r&&(r.op==='empty'||r.op==='filled'||(r.op==='range'&&(r.from||r.to))||((r.op==='contains'||r.op==='notContains'||r.op==='equals')&&String(r.value||'').trim()));}
function matchesRule(p,key,type,r){
 if(!ruleActive(r))return true;
 const v=fieldValue(p,key);
 if(r.op==='empty')return !v;
 if(r.op==='filled')return !!v;
 if(r.op==='range'){const d=dateValue(v);return !!d&&(!r.from||d>=r.from)&&(!r.to||d<=r.to);}
 if(r.op==='equals')return v===String(r.value).trim();
 const phoneDigits=type==='phone'&&/\d/.test(r.value);
 const a=phoneDigits?v.replace(/\D/g,''):normalized(v),b=phoneDigits?String(r.value).replace(/\D/g,''):normalized(r.value);
 const contains=a.includes(b);
 return r.op==='notContains'?!contains:contains;
}
function controlsFor(key,label,type){
 const r=draftFilters[key]||{},op=r.op||((type==='category'||type==='number')?'equals':type==='date'?'range':'contains');
 if(type==='category'){
  const values=[...new Set(people.map(p=>fieldValue(p,key)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
  const selected=op==='empty'?'__empty__':op==='filled'?'__filled__':r.value||'';
  return `<label><span>${label}</span><select data-filter="${key}" data-control="category"><option value="">Любое значение</option><option value="__filled__"${selected==='__filled__'?' selected':''}>Заполнено</option><option value="__empty__"${selected==='__empty__'?' selected':''}>Не заполнено</option>${values.map(v=>`<option value="${esc(v)}"${selected===v?' selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
 }
 if(type==='date')return `<div class="pd-birth-field"><label><span>${label}</span><select data-filter="${key}" data-control="op"><option value="range"${op==='range'?' selected':''}>Период</option><option value="filled"${op==='filled'?' selected':''}>Заполнено</option><option value="empty"${op==='empty'?' selected':''}>Не заполнено</option></select></label><div class="pd-birth-controls"><label><span>От</span><input type="date" data-filter="${key}" data-control="from" value="${esc(r.from||'')}"${op!=='range'?' disabled':''}></label><label><span>До</span><input type="date" data-filter="${key}" data-control="to" value="${esc(r.to||'')}"${op!=='range'?' disabled':''}></label></div></div>`;
 const states=type==='number'?[['equals','Равно'],['filled','Заполнено'],['empty','Не заполнено']]:[['contains','Содержит'],['notContains','Не содержит'],['filled','Заполнено'],['empty','Не заполнено']];
 return `<div><label for="pd-query-${key}"><span>${label}</span></label><div class="pd-field-controls"><input id="pd-query-${key}" data-filter="${key}" data-control="value" type="${type==='number'?'number':'text'}" maxlength="160" value="${esc(r.value||'')}" placeholder="${type==='number'?'Номер':'Слова или фраза'}"${op==='empty'||op==='filled'?' disabled':''}><select data-filter="${key}" data-control="op" aria-label="Условие: ${label}">${states.map(([v,l])=>`<option value="${v}"${v===op?' selected':''}>${l}</option>`).join('')}</select></div></div>`;
}
function drawFilterForm(){q('#pd-filter-fields').innerHTML=filterGroups.map(([title,fields])=>`<fieldset class="pd-filter-group"><legend>${title}</legend><div class="pd-filter-fields">${fields.map(f=>controlsFor(...f)).join('')}</div></fieldset>`).join('');updateDraftCount();}
function updateDraftCount(){q('#pd-draft-count').textContent=`Найдено: ${filtered(draftFilters).length}`;const r=draftFilters.birth;const invalid=r?.op==='range'&&r.from&&r.to&&r.from>r.to;q('#pd-filter-error').hidden=!invalid;q('#pd-filter-error').textContent=invalid?'Начало периода должно быть раньше его окончания.':'';q('#pd-apply-filters').disabled=!!invalid;}
function options(){if(filterDialog.open)drawFilterForm();}
const editorGroups=[
 ['Основные сведения','main',[['name','ФИО','name'],['region','Город / регион','suggest'],['track','Трек','suggest'],['trackDE','Entwicklungstrack','suggest'],['activity','Специальность и деятельность','long']]],
 ['Контакты','main',[['phone','Телефон','tel'],['email','Email','email'],['birth','Дата рождения','date']]],
 ['Уровни','main',[['level','Текущий уровень','suggest'],['dec2025','На 30.12.2025','suggest'],['jun2026','На 30.06.2026','suggest'],['dec2026','На 30.12.2026','suggest']]],
 ['Рекомендации и развитие','main',[['mainNote','Рекомендации и комментарии','long'],['future','Дальнейшее развитие','long']]],
 ['Анализ БКР','bkr',[['analysisRegion','Регион в анализе БКР','suggest'],['goal','Цель участника через 5 лет','long'],['recommendation','Рекомендация РО / РП / ИБ','long'],['training','Обучения и проекты за 2026 год','long'],['plan2027','План на 2027 год','long']]]
];
function pairs(p,fields,cls='pd-info') {return `<dl class="${cls}">${fields.map(([k,label])=>`<div><dt>${label}</dt><dd>${val(p[k])}</dd></div>`).join('')}</dl>`;}
function readableText(value){
 const text=String(value??'').trim();if(!text)return '<p class="pd-missing">Не заполнено</p>';
 const blocks=[];let kind='',lines=[];
 function flush(){
  if(!lines.length)return;
  if(kind==='ul')blocks.push('<ul>'+lines.map(line=>`<li>${esc(line.text)}</li>`).join('')+'</ul>');
  else if(kind==='ol')blocks.push('<ol>'+lines.map(line=>`<li value="${line.number}">${esc(line.text)}</li>`).join('')+'</ol>');
  else blocks.push('<p>'+lines.map(line=>esc(line.text)).join('\n')+'</p>');
  lines=[];
 }
 text.replace(/\r\n?/g,'\n').split('\n').forEach(line=>{
  if(!line.trim()){flush();kind='';return;}
  const bullet=line.match(/^\s*[-–—•*]\s+(.+)$/),numbered=line.match(/^\s*(\d{1,4})[.)]\s+(.+)$/);
  const next=bullet?'ul':numbered?'ol':'p';if(kind&&next!==kind)flush();kind=next;
  lines.push({text:bullet?bullet[1]:numbered?numbered[2]:line,number:numbered?Number(numbered[1]):null});
 });flush();return blocks.join('');
}
function contactValue(key,value){
 const text=String(value||'').trim();if(!text)return val(text);
 if(key==='email'&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text))return `<a href="mailto:${encodeURIComponent(text)}">${esc(text)}</a>`;
 if(key==='phone'&&/\d/.test(text)){const number=(text.startsWith('+')?'+':'')+text.replace(/\D/g,'');return `<a href="tel:${number}">${esc(text)}</a>`;}
 return esc(text);
}
function facts(p,fields,contacts=false){return `<dl class="pd-facts">${fields.map(([key,label])=>`<div><dt>${label}</dt><dd>${contacts?contactValue(key,p[key]):val(p[key])}</dd></div>`).join('')}</dl>`;}
function textCard(p,key,label){return `<section class="pd-text-card" data-field="${key}"><h4>${label}</h4><div class="pd-readable">${readableText(p[key])}</div></section>`;}
function content(p) {
 let note='';
 if(!p.hasAnalysis)note='<p class="pd-note">Для этого участника пока нет связанной записи анализа БКР.</p>';
 else if(p.region&&p.analysisRegion&&p.region.trim().toLowerCase()!==p.analysisRegion.trim().toLowerCase())note=`<p class="pd-note">Различаются регионы: в основном списке — ${esc(p.region)}, в анализе БКР — ${esc(p.analysisRegion)}.</p>`;
 return `<div class="pd-profile">${note}<div class="pd-profile-top">
 <section class="pd-profile-card"><h3>Контакты</h3>${facts(p,[['phone','Телефон'],['email','Email'],['birth','Дата рождения']],true)}</section>
 <section class="pd-profile-card"><h3>Деятельность</h3>${facts(p,[['activity','Специальность и деятельность'],['trackDE','Направление развития']])}</section></div>
 <section class="pd-profile-card pd-levels-card"><div class="pd-section-head"><h3>Уровни</h3><span class="pd-source">Основной список</span></div><dl class="pd-levels-grid">${[['level','Текущий уровень'],['dec2025','30.12.2025'],['jun2026','30.06.2026'],['dec2026','30.12.2026']].map(([key,label],i)=>`<div${i===0?' class="pd-current-level"':''}><dt>${label}</dt><dd>${p[key]?`<span class="pd-level-value">${esc(p[key])}</span>`:'<span class="pd-missing">Не заполнено</span>'}</dd></div>`).join('')}</dl></section>
 <section class="pd-profile-section"><div class="pd-section-head"><h3>Развитие и план</h3><span class="pd-source">Анализ БКР</span></div><div class="pd-text-grid">${[['goal','Цель на 5 лет'],['recommendation','Рекомендация РО / РП / ИБ'],['training','Обучение и проекты · 2026'],['plan2027','План · 2027']].map(([key,label])=>textCard(p,key,label)).join('')}</div></section>
 <section class="pd-profile-section"><div class="pd-section-head"><h3>Комментарии и дальнейшее развитие</h3><span class="pd-source">Основной список</span></div><div class="pd-text-grid">${[['mainNote','Рекомендации и комментарии'],['future','Дальнейшее развитие']].map(([key,label])=>textCard(p,key,label)).join('')}</div></section>
 <div class="pd-actions">${p.canEditMain||p.canEditBkr?`<button type="button" class="pd-save cursor-interaction" data-edit-start="${p.id}">Редактировать участника</button>`:''}</div></div>`;
}
function filtered(rules=appliedFilters) {
 const needle=normalized(q('#pd-search').value);
 return people.filter(p=>normalized(p.name).includes(needle)&&allFilterFields.every(([key,label,type])=>matchesRule(p,key,type,rules[key])));
}
function render() {
 const matches=filtered(),totalPages=Math.max(1,Math.ceil(matches.length/pageSize));
 currentPage=Math.max(1,Math.min(currentPage,totalPages));
 const offset=(currentPage-1)*pageSize,shown=matches.slice(offset,offset+pageSize);
 q('#pd-count').textContent=matches.length?`Найдено: ${matches.length} из ${people.length} · показаны ${offset+1}–${offset+shown.length}`:`Найдено: 0 из ${people.length}`;
 q('#pd-list').innerHTML=shown.length?shown.map(p=>`<details data-id="${p.id}"${p.id===openId?' open':''}><summary class="cursor-interaction"><span class="pd-name">${esc(p.name)}</span><span class="pd-region">${esc(p.region||p.analysisRegion||'—')}</span><span class="pd-track">${esc(p.track||p.trackDE||'—')}</span><span class="pd-level">${esc(p.level||'—')}</span><span class="pd-toggle"><span class="pd-open">Раскрыть ↓</span><span class="pd-close">Свернуть ↑</span></span></summary><div class="pd-content">${content(p)}</div></details>`).join(''):'<p class="pd-empty">Ничего не найдено</p>';
 q('#pd-pagination').hidden=matches.length===0;
 q('#pd-page-info').textContent=`Страница ${currentPage} из ${totalPages}`;
 let pageButtons=`<button type="button" class="pd-page-button cursor-interaction" data-page="${currentPage-1}" aria-label="Предыдущая страница"${currentPage===1?' disabled':''}>←</button>`;
 pageButtons+=`<div class="pd-page-picker"><button id="pd-page-toggle" type="button" class="pd-page-button cursor-interaction" aria-expanded="false" aria-controls="pd-page-menu" aria-label="Выбрать страницу: ${currentPage} из ${totalPages}"><span>${currentPage}</span><span aria-hidden="true">▾</span></button><div id="pd-page-menu" class="pd-page-menu" role="group" aria-label="Все страницы" hidden>${Array.from({length:totalPages},(_,i)=>{const n=i+1;return `<button type="button" class="cursor-interaction" data-page="${n}" aria-label="Страница ${n}"${n===currentPage?' aria-current="page"':''}>Страница ${n}</button>`;}).join('')}</div></div>`;
 pageButtons+=`<button type="button" class="pd-page-button cursor-interaction" data-page="${currentPage+1}" aria-label="Следующая страница"${currentPage===totalPages?' disabled':''}>→</button>`;
 q('#pd-page-controls').innerHTML=pageButtons;
 const count=Object.values(appliedFilters).filter(ruleActive).length;
 q('#pd-filter-badge').textContent=String(count);
 q('#pd-filter-badge').hidden=count===0;
 q('#pd-open-filters').setAttribute('aria-label',count?`Фильтры, выбрано условий: ${count}`:'Фильтры');
}
function persist(){}
function setPageMenu(open,focus=false){
 const menu=q('#pd-page-menu'),toggle=q('#pd-page-toggle');if(!menu||!toggle)return;
 menu.hidden=!open;toggle.setAttribute('aria-expanded',String(open));
 if(open){const selected=menu.querySelector('[aria-current="page"]');if(selected){menu.scrollTop=Math.max(0,selected.offsetTop-(menu.clientHeight-selected.offsetHeight)/2);if(focus)selected.focus({preventScroll:true});}}
 else if(focus)toggle.focus({preventScroll:true});
}
document.addEventListener('click',e=>{if(!q('.pd-page-picker')?.contains(e.target))setPageMenu(false);});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&q('#pd-page-menu')&&!q('#pd-page-menu').hidden){e.preventDefault();setPageMenu(false,true);}});
root.addEventListener('click',e=>{
 const summary=e.target.closest('summary');
 if(summary){e.preventDefault();const d=summary.closest('details');const next=!d.open;root.querySelectorAll('details').forEach(x=>x.open=false);d.open=next;openId=next?d.dataset.id:null;persist();return;}
 const button=e.target.closest('button');if(!button)return;
 if(button.id==='pd-page-toggle'){setPageMenu(q('#pd-page-menu').hidden,true);return;}
 if(button.dataset.page!==undefined&&!button.disabled){const next=Number(button.dataset.page);if(next===currentPage){setPageMenu(false,true);return;}currentPage=next;openId=null;q('#pd-status').textContent='';render();const list=q('#pd-list');list.classList.remove('pd-page-enter');void list.offsetWidth;list.classList.add('pd-page-enter');q('#pd-page-toggle')?.focus({preventScroll:true});const columns=q('.pd-columns');(columns.getClientRects().length?columns:list).scrollIntoView({block:'start'});persist();return;}
 if(button.dataset.editStart){if(loading||saving)return;openEditor(people.find(p=>p.id===button.dataset.editStart));}
});
function filterChanged(){currentPage=1;openId=null;q('#pd-status').textContent='';render();persist();}
q('#pd-search').addEventListener('input',filterChanged);
q('#pd-open-filters').addEventListener('click',()=>{draftFilters=JSON.parse(JSON.stringify(appliedFilters));drawFilterForm();filterDialog.showModal();q('#pd-filter-fields').scrollTop=0;q('#pd-close-filters').focus({preventScroll:true});});
q('#pd-close-filters').addEventListener('click',()=>filterDialog.close());
filterDialog.addEventListener('click',e=>{if(e.target===filterDialog){const r=filterDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)filterDialog.close();}});
q('#pd-filter-fields').addEventListener('input',readDraftControl);
q('#pd-filter-fields').addEventListener('change',readDraftControl);
function readDraftControl(e){
 const control=e.target,key=control.dataset.filter,kind=control.dataset.control;if(!key)return;
 const field=allFilterFields.find(f=>f[0]===key),r=draftFilters[key]||{op:field[2]==='date'?'range':field[2]==='number'?'equals':'contains',value:''};
 if(kind==='category')draftFilters[key]=control.value==='__empty__'?{op:'empty'}:control.value==='__filled__'?{op:'filled'}:{op:'equals',value:control.value};
 else{r[kind]=control.value;draftFilters[key]=r;if(kind==='op'){root.querySelectorAll(`[data-filter="${key}"]`).forEach(el=>{if(el.dataset.control!=='op')el.disabled=r.op==='empty'||r.op==='filled';});}}
 updateDraftCount();
}
q('#pd-reset-filters').addEventListener('click',()=>{draftFilters={};drawFilterForm();});
q('#pd-apply-filters').addEventListener('click',()=>{if(q('#pd-apply-filters').disabled)return;appliedFilters=Object.fromEntries(Object.entries(draftFilters).filter(([key,r])=>ruleActive(r)));filterDialog.close();filterChanged();});

const editorDialog=q('#pd-editor-dialog'),editorForm=q('#pd-editor-form');
function newRequestId(){
 const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
 const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
function editorField(p,key,label,type){
 const value=String(p[key]||''),id='pd-edit-'+key;
 if(type==='long')return `<label${key==='activity'?' class="pd-editor-wide"':''} for="${id}"><span>${label}</span><textarea id="${id}" name="${key}" maxlength="30000" rows="3" placeholder="Можно заполнить позже">${esc(value)}</textarea></label>`;
 const useDate=type==='date'&&(!value||dateValue(value));
 const inputType=type==='tel'?'tel':useDate?'date':'text';
 const suggestions=type==='suggest'?[...new Set(people.map(p=>String(p[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true})):[];
 return `<label${type==='name'?' class="pd-editor-wide"':''} for="${id}"><span>${label}${type==='name'?' <strong class="pd-required">*</strong>':''}</span><input id="${id}" name="${key}" type="${inputType}" value="${esc(useDate?dateValue(value):value)}" maxlength="30000"${type==='name'?' required autocomplete="name" placeholder="Введите фамилию, имя и отчество"':type==='email'?' inputmode="email" autocomplete="email"':type==='tel'?' autocomplete="tel"':type==='date'&&!useDate?' placeholder="ДД.ММ.ГГГГ"':''}${suggestions.length?` list="pd-suggest-${key}"`:''}>${suggestions.length?`<datalist id="pd-suggest-${key}">${suggestions.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`:''}</label>`;
}
function openEditor(person=null){
 if(loading||saving||(!person&&!canCreate))return;
 setPageMenu(false);
 const isNew=!person,p=person||{};
 editor={isNew,person:p,requestId:isNew?newRequestId():null};
 q('#pd-editor-title').textContent=isNew?'Новый участник':'Редактировать участника';
 q('#pd-editor-subtitle').textContent=isNew?'Обязательно только ФИО. Остальные сведения можно заполнить позже.':p.name;
 q('#pd-editor-submit').textContent=isNew?'Добавить участника':'Сохранить изменения';
 q('#pd-editor-hint').textContent=isNew?'После добавления участник появится в обеих таблицах.':'Изменения сохранятся в соответствующих таблицах.';
 q('#pd-editor-fields').innerHTML=editorGroups.map(([title,source,fields])=>{
  const editable=isNew||source==='main'&&p.canEditMain||source==='bkr'&&p.canEditBkr;
  const shown=fields.filter(([key])=>!(isNew&&key==='analysisRegion'));
  return `<fieldset data-source="${source}"${editable?'':' disabled'}><legend>${title}${editable?'':' <small>· только просмотр</small>'}</legend>${!isNew&&source==='bkr'&&!p.hasAnalysis?'<p class="pd-editor-section-note">Связанная запись анализа БКР отсутствует.</p>':''}<div class="pd-editor-grid">${shown.map(([key,label,type])=>editorField(p,key,label,type)).join('')}</div></fieldset>`;
 }).join('');
 showEditorError('');editorDialog.showModal();q('#pd-editor-fields').scrollTop=0;
 if(isNew||p.canEditMain)q('#pd-edit-name').focus({preventScroll:true});
 else q('#pd-editor-fields input:enabled,#pd-editor-fields textarea:enabled')?.focus({preventScroll:true});
}
function editorValues(){
 const values=Object.fromEntries([...new FormData(editorForm)].map(([key,v])=>[key,String(v).trim()]));
 if(values.birth&&/^\d{4}-\d{2}-\d{2}$/.test(values.birth))values.birth=values.birth.split('-').reverse().join('.');
 return values;
}
function editorDirty(){
 if(!editor)return false;
 return Object.entries(editorValues()).some(([key,v])=>v!==String(editor.person[key]||'').trim());
}
function closeEditor(force=false){
 if(!force&&(saving||editorDirty()&&!window.confirm('Закрыть форму и отменить несохранённые изменения?')))return;
 editorDialog.close();editor=null;q('#pd-editor-fields').innerHTML='';
}
function showEditorError(message){q('#pd-editor-error').textContent=message;q('#pd-editor-error').hidden=!message;}
q('#pd-add').addEventListener('click',()=>openEditor());
q('#pd-editor-close').addEventListener('click',()=>closeEditor());
q('#pd-editor-cancel').addEventListener('click',()=>closeEditor());
editorDialog.addEventListener('cancel',e=>{e.preventDefault();closeEditor();});
window.addEventListener('beforeunload',e=>{if(editorDirty()){e.preventDefault();e.returnValue='';}});
editorForm.addEventListener('submit',async e=>{
 e.preventDefault();if(saving||loading||!editor||!editorForm.reportValidity())return;
 const values=editorValues(),active=editor;
 if(Object.hasOwn(values,'name')&&!values.name){showEditorError('Укажите ФИО участника.');q('#pd-edit-name').focus();return;}
 const sections={};
 if(!active.isNew){
  editorGroups.forEach(([,source,fields])=>{
   for(const [key]of fields){if(!Object.hasOwn(values,key)||values[key]===String(active.person[key]||'').trim())continue;
    if(!sections[source])sections[source]={revision:source==='main'?active.person.revisionMain:active.person.revisionBkr,changes:{}};
    sections[source].changes[key]=values[key];
   }
  });
  if(!Object.keys(sections).length){closeEditor(true);q('#pd-status').textContent='Изменений нет.';return;}
 }
 saving=true;showEditorError('');updateControls();q('#pd-editor-submit').textContent=active.isNew?'Добавление…':'Сохранение…';
 try{
  const result=active.isNew?await rpc('createPersonnel',{requestId:active.requestId,values}):await rpc('updatePersonnel',{id:active.person.id,sections});
  const focusId=active.isNew?result.id:active.person.id;
  closeEditor(true);
  if(active.isNew){appliedFilters={};q('#pd-search').value='';}
  const refreshed=await loadData(focusId);
  q('#pd-status').textContent=refreshed?(active.isNew?'Участник добавлен в обе таблицы.':'Изменения сохранены.'):(active.isNew?'Участник записан. Нажмите «Обновить данные», чтобы загрузить список.':'Изменения записаны. Нажмите «Обновить данные», чтобы загрузить список.');
 }catch(error){showEditorError(error.message);}
 finally{saving=false;updateControls();q('#pd-editor-submit').textContent=active.isNew?'Добавить участника':'Сохранить изменения';}
});

function rpc(method,payload){
 return new Promise((resolve,reject)=>{
  if(typeof google==='undefined'||!google.script?.run){reject(new Error('Откройте опубликованную ссылку веб-приложения Apps Script. Локальный HTML не подключается к таблицам.'));return;}
  const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e))));
  payload===undefined?runner[method]():runner[method](payload);
 });
}
function showError(message){q('#pd-live-error').textContent=message;q('#pd-live-error').hidden=!message;}
function updateControls(){
 const busy=loading||saving;
 q('#pd-reload').disabled=busy;q('#pd-open-filters').disabled=busy;q('#pd-add').hidden=!canCreate;q('#pd-add').disabled=busy;
 q('#pd-list').inert=busy;q('#pd-pagination').inert=busy;
 q('#pd-editor-fields').inert=saving;editorForm.setAttribute('aria-busy',String(saving));
 q('#pd-editor-submit').disabled=saving;q('#pd-editor-close').disabled=saving;q('#pd-editor-cancel').disabled=saving;
}
async function loadData(focusId=null){
 if(loading)return false;loading=true;updateControls();showError('');q('#pd-loaded').textContent='Загрузка из Google Таблиц…';
 if(!people.length){q('#pd-list').innerHTML='<p class="pd-empty">Загрузка…</p>';q('#pd-count').textContent='';q('#pd-pagination').hidden=true;}
 try{
  const result=await rpc('loadPersonnel');
  if(!result||!Array.isArray(result.people))throw new Error('Сервер вернул некорректный ответ.');
  people=result.people;canCreate=!!result.canCreate;
  if(focusId){openId=focusId;const index=filtered().findIndex(p=>p.id===focusId);if(index>=0)currentPage=Math.floor(index/pageSize)+1;}
  render();options();
  if(focusId)q('#pd-list details[open] > summary')?.scrollIntoView({block:'start'});
  q('#pd-loaded').textContent='Обновлено: '+new Date(result.loadedAt).toLocaleString('ru-RU');
  q('#pd-unlinked').hidden=!result.unlinkedAnalysisCount;
  q('#pd-unlinked').textContent=result.unlinkedAnalysisCount?`Записей только в анализе БКР: ${result.unlinkedAnalysisCount}. Для отображения участника нужна запись с тем же ID в основном списке.`:'';
  updateBackToTop();
  return true;
 }catch(error){
  people=[];canCreate=false;openId=null;render();q('#pd-list').innerHTML='<p class="pd-empty">Данные недоступны</p>';q('#pd-count').textContent='';q('#pd-unlinked').hidden=true;q('#pd-loaded').textContent='Не удалось загрузить таблицы';showError(error.message);return false;
 }finally{loading=false;updateControls();}
}
q('#pd-reload').addEventListener('click',()=>{openId=null;q('#pd-status').textContent='';loadData();});
loadData();

})();
</script>
</div>

</body></html>
